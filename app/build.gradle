plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '1.9.24'
    id 'com.google.devtools.ksp' version '1.9.24-1.0.20'
}

android {
    namespace 'com.example.bwcomm'
    compileSdk 34 // Updated to 34

    defaultConfig {
        applicationId "com.example.bwcomm"
        minSdk 23
        targetSdk 33 // Can update to 34 if desired
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.3.1'
    implementation 'androidx.activity:activity-compose:1.5.1'
    implementation platform('androidx.compose:compose-bom:2023.08.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2023.08.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Coroutines for asynchronous tasks
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // WebRTC for voice and video streaming
    implementation 'com.infobip:google-webrtc:1.0.39079'

    // Opus codec for audio (commented out, assuming WebRTC includes it)
    // implementation 'org.xiph:libopus:1.3.1'

    // Netty for TCP/UDP networking
    implementation 'io.netty:netty-all:4.1.82.Final'

    // Room for local storage
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // SQLCipher for encrypted local storage
    implementation 'net.zetetic:android-database-sqlcipher:4.5.0'

    // Explicitly declare transitive dependencies
    implementation 'androidx.emoji2:emoji2:1.4.0'
    implementation 'androidx.sqlite:sqlite-framework:2.4.0'
    implementation 'androidx.sqlite:sqlite:2.4.0'

    // CameraX for video capture
    implementation 'androidx.camera:camera-core:1.2.3'
    implementation 'androidx.camera:camera-camera2:1.2.3'
    implementation 'androidx.camera:camera-lifecycle:1.2.3'
    implementation 'androidx.camera:camera-view:1.2.3'

    // WorkManager for background tasks
    implementation 'androidx.work:work-runtime-ktx:2.7.1'

    // Navigation Compose
    implementation "androidx.navigation:navigation-compose:2.7.0"
}